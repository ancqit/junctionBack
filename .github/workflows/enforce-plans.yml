# Plan enforce (trial → plan / viewer → close)
# - Weekly (Sunday 04:00 UTC) — same secrets as waste crawl
# - Also runnable manually from the Actions tab
#
# Required repo secrets:
#   JUNCTIONBACK_URL  e.g. https://junctionback.onrender.com
#   CRON_SECRET       must match Render env CRON_SECRET

name: Enforce plans

on:
  schedule:
    # Weekly — Sunday 04:00 UTC (one hour after waste archive crawl)
    - cron: "0 4 * * 0"
  workflow_dispatch:

jobs:
  enforce:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger enforce-plans
        env:
          JUNCTIONBACK_URL: ${{ secrets.JUNCTIONBACK_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${JUNCTIONBACK_URL:-}" ] || [ -z "${CRON_SECRET:-}" ]; then
            echo "Missing JUNCTIONBACK_URL or CRON_SECRET repo secrets."
            exit 1
          fi
          BASE="${JUNCTIONBACK_URL%/}"
          echo "POST ${BASE}/internal/jobs/enforce-plans"
          for i in 1 2 3 4 5 6; do
            code=$(curl -sS -o /tmp/enforce.json -w "%{http_code}" \
              -X POST \
              -H "X-Cron-Secret: ${CRON_SECRET}" \
              -H "Accept: application/json" \
              "${BASE}/internal/jobs/enforce-plans" || true)
            echo "Attempt ${i}: HTTP ${code}"
            if [ "${code}" = "200" ]; then
              cat /tmp/enforce.json
              exit 0
            fi
            sleep 30
          done
          echo "Enforce-plans failed after retries"
          cat /tmp/enforce.json || true
          exit 1
